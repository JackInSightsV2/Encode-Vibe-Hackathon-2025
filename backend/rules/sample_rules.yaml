rules:
  - id: "test_hate_001"
    name: "Basic Hate Speech Detection"
    description: "Detects basic hate speech keywords"
    type: "keyword"
    keywords: ["hate", "stupid", "idiot", "loser", "dumb", "retard"]
    weight: 0.8
    priority: 1
    action: "flag"
    category: "hate_speech"
    enabled: true
    created_at: "2025-01-06T12:00:00Z"
    updated_at: "2025-01-06T12:00:00Z"

  - id: "test_violence_001"
    name: "Violence Threat Detection"
    description: "Detects direct threats of violence"
    type: "regex"
    pattern: "(?i)\\b(kill|murder|destroy|eliminate)\\s+(you|him|her|them)\\b"
    weight: 0.9
    priority: 1
    action: "block"
    category: "violence"
    enabled: true
    created_at: "2025-01-06T12:00:00Z"
    updated_at: "2025-01-06T12:00:00Z"

  - id: "test_weapons_001"
    name: "Weapons and Violence"
    description: "Detects weapons and violence keywords"
    type: "keyword"
    keywords: ["bomb", "weapon", "gun", "shoot", "attack", "stab", "knife", "pistol", "rifle"]
    weight: 0.9
    priority: 1
    action: "flag"
    category: "violence"
    enabled: true
    created_at: "2025-01-06T12:00:00Z"
    updated_at: "2025-01-06T12:00:00Z"

  - id: "test_selfharm_001"
    name: "Self-Harm Detection"
    description: "Detects self-harm related content"
    type: "keyword"
    keywords: ["hurt myself", "kill myself", "suicide", "self-harm", "end my life", "hurt people"]
    weight: 0.8
    priority: 1
    action: "flag"
    category: "self_harm"
    enabled: true
    created_at: "2025-01-06T12:00:00Z"
    updated_at: "2025-01-06T12:00:00Z"

  - id: "test_threats_001"
    name: "Threat Detection"
    description: "Detects general threats and intimidation"
    type: "regex"
    pattern: "(?i)\\b(hurt|harm|attack|eliminate|destroy)\\s+(people|everyone|them|you)"
    weight: 0.8
    priority: 1
    action: "flag"
    category: "threats"
    enabled: true
    created_at: "2025-01-06T12:00:00Z"
    updated_at: "2025-01-06T12:00:00Z"

  - id: "test_school_violence_001"
    name: "School Violence Detection"
    description: "Detects school violence threats"
    type: "regex"
    pattern: "(?i)\\b(shoot\\s+up|bomb)\\s+(school|mall|airport|building)"
    weight: 0.95
    priority: 1
    action: "block"
    category: "violence"
    enabled: true
    created_at: "2025-01-06T12:00:00Z"
    updated_at: "2025-01-06T12:00:00Z"

  - id: "test_profanity_001"
    name: "Profanity Filter"
    description: "Basic profanity detection"
    type: "regex"
    pattern: "(?i)\\b(damn|shit|fuck|bitch)\\b"
    weight: 0.4
    priority: 4
    action: "warn"
    category: "profanity"
    enabled: true
    created_at: "2025-01-06T12:00:00Z"
    updated_at: "2025-01-06T12:00:00Z" 