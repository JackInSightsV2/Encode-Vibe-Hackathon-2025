[supervisord]
nodaemon=true
user=mockware
logfile=/app/logs/supervisord.log
pidfile=/app/data/supervisord.pid
childlogdir=/app/logs
loglevel=info

[unix_http_server]
file=/app/data/supervisor.sock
chmod=0700
chown=mockware:mockware

[supervisorctl]
serverurl=unix:///app/data/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Mock Provider Service
[program:mock-provider]
command=npm start
directory=/app/mock-provider
user=mockware
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/app/logs/mock-provider.log
stderr_logfile=/app/logs/mock-provider-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
environment=PORT="8081",NODE_ENV="production",RESPONSE_DELAY_MIN="%(ENV_RESPONSE_DELAY_MIN)s",RESPONSE_DELAY_MAX="%(ENV_RESPONSE_DELAY_MAX)s",ERROR_RATE="%(ENV_ERROR_RATE)s",ENABLE_ERROR_SIMULATION="%(ENV_ENABLE_ERROR_SIMULATION)s",ENABLE_STREAMING="%(ENV_ENABLE_STREAMING)s"

# Testing Client Service
[program:testing-client]
command=npm start
directory=/app/testing-client
user=mockware
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/app/logs/testing-client.log
stderr_logfile=/app/logs/testing-client-error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
environment=PORT="3000",NODE_ENV="production",DEFAULT_TARGET_URL="%(ENV_DEFAULT_TARGET_URL)s",MOCK_PROVIDER_URL="http://localhost:8081",MIDDLEWARE_URL="http://localhost:8081",MAX_CONCURRENT_REQUESTS="100",REQUEST_TIMEOUT="30000"
depends_on=mock-provider

# Event listener for graceful shutdown
[eventlistener:shutdown]
command=/bin/bash -c "trap 'supervisorctl stop all; exit 0' SIGTERM SIGINT; while true; do sleep 1; done"
events=PROCESS_STATE
autostart=true
autorestart=unexpected